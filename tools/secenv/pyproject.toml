[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-secenv"
version = "0.4.0"
description = "Fail-closed credential intake through a native Workbench modal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1",
]

[project.scripts]
secenv = "secenv_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
