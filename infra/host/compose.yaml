name: workbench
services:
  database:
    image: postgres:17
    restart: unless-stopped
    labels: {workbench.managed: "true"}
    environment:
      POSTGRES_USER: coder
      POSTGRES_DB: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [workbench]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coder -d coder]
      interval: 5s
      timeout: 5s
      retries: 20
  coder:
    image: ghcr.io/coder/coder:v2.36.4
    restart: unless-stopped
    labels: {workbench.managed: "true"}
    ports: ["127.0.0.1:7080:7080"]
    environment:
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:?required}
      CODER_REDIRECT_TO_ACCESS_URL: "false"
      CODER_PG_CONNECTION_URL: ${CODER_PG_CONNECTION_URL:?required}
    group_add: ["${DOCKER_GID:?required}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [workbench]
    depends_on:
      database:
        condition: service_healthy
  cloudflared:
    profiles: [public]
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    labels: {workbench.managed: "true"}
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel-token]
    volumes:
      - ./secrets/cloudflared.token:/run/secrets/tunnel-token:ro
    networks: [workbench]
  vault-sync:
    environment: {TZ: "${WORKBENCH_TIMEZONE:?required}"}
    profiles: [sync]
    image: workbench-workspace:2026-09-09
    restart: unless-stopped
    labels: {workbench.managed: "true"}
    command: [node, /opt/workbench-sync/node_modules/obsidian-headless/cli-safe.cjs, sync, --path, /vault, --continuous]
    volumes:
      - shared-vault:/vault
      - sync-config:/workspace/.config/obsidian-headless
    networks: [workbench]
networks:
  workbench:
    name: workbench-network
volumes:
  database:
  shared-vault:
    name: workbench-vault
  sync-config:
    name: workbench-sync-config
