name: Validate private workbench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run privacy, secret, structure, and link checks
        run: bash scripts/audit-publication.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test secure credential intake
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          bash scripts/verify-all.sh

      - name: Test fail-closed installers
        run: bash scripts/test-installers.sh

  isolated-stack:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    env:
      WORKBENCH_ISOLATED_DOCKER: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exercise Coder, workspace image, SSH and persistent volumes
        run: python3 infra/tests/smoke_stack.py
