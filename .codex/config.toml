# Conservative project-local defaults. This file contains no credentials.
# Codex loads project configuration only after the repository is trusted.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

[shell_environment_policy]
# Start from a small core environment. Keep Codex's automatic filtering for
# variable names containing KEY, SECRET, or TOKEN.
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"*PASSWORD*" = "exclude"
"*PASSPHRASE*" = "exclude"
"*MNEMONIC*" = "exclude"
"*SEED_PHRASE*" = "exclude"
"*RECOVERY_CODE*" = "exclude"
